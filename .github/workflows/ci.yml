name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, phase-b/database-boundary]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run check

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
