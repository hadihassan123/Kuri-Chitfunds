services:
  # FastAPI application tier. Supabase is the authoritative data tier.
  - type: web
    name: kuri-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://kuri-frontend.onrender.com

  # React/Vite presentation tier.
  - type: web
    name: kuri-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://kuri-frontend.onrender.com https://kxhjkfwqcmgfbxqqyqby.supabase.co; connect-src 'self' https://kuri-backend-0veb.onrender.com https://kxhjkfwqcmgfbxqqyqby.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
    envVars:
      - key: VITE_API_URL
        value: https://kuri-backend-0veb.onrender.com
